<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Moussa Sow</title>
<desc id="desc">Software Engineering, Information Systems, Data and AI</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#6366F1"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#0D1117" stroke-opacity="0.06"/>
  </pattern>
  <radialGradient id="glowT"><stop offset="0" stop-color="#14B8A6" stop-opacity=".35"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowI"><stop offset="0" stop-color="#6366F1" stop-opacity=".35"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .edge { stroke: #57606A; stroke-opacity: .25; stroke-width: 1.5; }
  .pulse { stroke: url(#g); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 18 1000;
           stroke-dashoffset: 18; animation: flow 4s linear infinite; }
  @keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: -260; } }
  .core { animation: beat 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes beat { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .glow { animation: drift 12s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(60px, 20px); } }
  .prompt { font: 500 20px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #14B8A6; }
  .caret { fill: #14B8A6; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .name { font: 800 76px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #0D1117; letter-spacing: -1.5px; }
  .dom { font: 700 27px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#g); animation: rise 1.2s ease-out .3s backwards; }
  .sep { fill: #57606A; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .tag { font: 400 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #57606A; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
<rect width="1200" height="340" rx="20" fill="#FFFFFF"/>
<rect width="1200" height="340" rx="20" fill="url(#grid)"/>
<circle class="glow" cx="980" cy="120" r="260" fill="url(#glowI)"/>
<circle class="glow" cx="760" cy="300" r="220" fill="url(#glowT)" style="animation-delay:-6s"/>
<text x="64" y="92" class="prompt">~/sow221 $ whoami</text>
