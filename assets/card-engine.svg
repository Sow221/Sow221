<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">cif-credit-engine</title><desc id="d">Illustration: data flows through versioned pipelines to an XGBoost model served by FastAPI, with drift monitoring.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#6366F1"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
  </pattern>
</defs>
<style>
  .lbl { font: 600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8B949E; }
  .txt { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; }
  .sm { font: 500 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8B949E; }
  .flow { stroke-dasharray: 4 4; animation: dash 1s linear infinite; }@keyframes dash { to { stroke-dashoffset: -8; } }.spark { stroke-dasharray: 520; animation: draw 3s ease-out backwards; }@keyframes draw { from { stroke-dashoffset: 520; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
<rect width="480" height="300" rx="16" fill="#0D1117"/>
<rect width="480" height="300" rx="16" fill="url(#grid)"/>
<rect x=".75" y=".75" width="478.5" height="298.5" rx="15.5" fill="none" stroke="#30363D" stroke-width="1.5"/>
<circle cx="24" cy="24" r="5" fill="#FF5F57"/><circle cx="42" cy="24" r="5" fill="#FEBC2E"/><circle cx="60" cy="24" r="5" fill="#28C840"/>
<text x="80" y="28" class="lbl">cif-credit-engine</text>
<rect x="22" y="72" width="102" height="70" rx="10" fill="#161B22" stroke="#14B8A6" stroke-width="1.5"/><text x="73" y="102" text-anchor="middle" class="txt">Credit data</text><text x="73" y="122" text-anchor="middle" class="sm" style="font-size:11px">raw · versioned</text><line x1="124" y1="107" x2="134" y2="107" stroke="url(#g)" stroke-width="2" class="flow"/><rect x="134" y="72" width="102" height="70" rx="10" fill="#161B22" stroke="#14B8A6" stroke-width="1.5"/><text x="185" y="102" text-anchor="middle" class="txt">Pipelines</text><text x="185" y="122" text-anchor="middle" class="sm" style="font-size:11px">DVC · Dagster</text><line x1="236" y1="107" x2="246" y2="107" stroke="url(#g)" stroke-width="2" class="flow"/><rect x="246" y="72" width="102" height="70" rx="10" fill="#161B22" stroke="#6366F1" stroke-width="1.5"/><text x="297" y="102" text-anchor="middle" class="txt">Model</text><text x="297" y="122" text-anchor="middle" class="sm" style="font-size:11px">XGBoost · MLflow</text><line x1="348" y1="107" x2="358" y2="107" stroke="url(#g)" stroke-width="2" class="flow"/><rect x="358" y="72" width="102" height="70" rx="10" fill="#161B22" stroke="#6366F1" stroke-width="1.5"/><text x="409" y="102" text-anchor="middle" class="txt">Serving</text><text x="409" y="122" text-anchor="middle" class="sm" style="font-size:11px">FastAPI</text><text x="28" y="180" class="lbl">drift monitor · PSI</text><line x1="28" y1="205" x2="452" y2="205" stroke="#F85149" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="452" y="198" text-anchor="end" class="sm">alert threshold</text><polyline points="40,250 80,244 120,247 160,238 200,241 240,229 280,233 320,220 360,226 400,212 440,216" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="spark"/>
</svg>
